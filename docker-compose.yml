# gluetun runs as an external container, managed outside this project.
# It must already be running before `docker compose up` — Compose cannot start
# or order a container it does not own.
#
#   docker ps --filter name=gluetun --format '{{.Names}}  {{.Status}}'
#
# IMPORTANT: whenever you recreate gluetun, recreate the recorder too:
#   docker compose up -d --force-recreate recorder
# A `container:` network reference is bound to the namespace of the container
# that existed at create time; a plain restart will not reattach it.

services:
  recorder:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: librisrecorder:latest
    container_name: libris-recorder
    # Join the external gluetun container's network namespace: the recorder has
    # no network stack of its own, so nothing can bypass the VPN. Set
    # GLUETUN_CONTAINER in .env to whatever your VPN container is named.
    network_mode: "container:${GLUETUN_CONTAINER:-gluetun}"
    # No depends_on: gluetun lives outside this project, so Compose cannot gate
    # on its health. This is safe — gluetun's killswitch blocks all traffic
    # until the tunnel is up, so an early start just means the first few polls
    # fail and back off. It cannot leak.
    volumes:
      - ./config:/config:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings
    environment:
      LIBRIS_CONFIG: /config/config.yaml
      TZ: ${TZ:-UTC}
      # Referenced by config.yaml via ${API_TOKEN} if you enable that header.
      API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
